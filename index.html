<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — School Inventory System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 60%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrap {
      width: 100%;
      max-width: 440px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-brand-icon {
      width: 64px; height: 64px;
      background: var(--primary);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(37,99,235,.4);
    }
    .login-brand-icon svg { width: 34px; height: 34px; fill: white; }
    .login-brand h1 {
      font-size: 1.375rem;
      font-weight: 800;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .login-brand p {
      font-size: 0.875rem;
      color: #64748b;
    }

    .login-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: 0 24px 48px rgba(0,0,0,.35);
    }

    .login-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .login-card .login-sub {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 28px;
    }

    .login-card .form-label { color: #94a3b8; }
    .login-card .form-control {
      background: rgba(255,255,255,.07);
      border-color: rgba(255,255,255,.12);
      color: #f1f5f9;
    }
    .login-card .form-control:focus {
      background: rgba(255,255,255,.1);
      border-color: var(--primary);
    }
    .login-card .form-control::placeholder { color: #475569; }

    .login-error {
      background: rgba(220,38,38,.15);
      border: 1px solid rgba(220,38,38,.3);
      color: #fca5a5;
      border-radius: var(--radius);
      padding: 11px 14px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
    }
    .login-error.show { display: flex; align-items: center; gap: 8px; }
    .login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8125rem;
      color: #475569;
    }
    .login-footer a { color: #60a5fa; }
    .login-footer a:hover { color: #93c5fd; }

    .pw-toggle {
      position: absolute;
      top: 50%; right: 12px;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer;
      color: #475569;
      display: flex; align-items: center;
      padding: 0;
      transition: color var(--transition);
    }
    .pw-toggle:hover { color: #94a3b8; }
    .pw-toggle svg { width: 16px; height: 16px; }

    .login-card .btn-primary { width: 100%; margin-top: 8px; padding: 12px; font-size: 1rem; }

    .demo-accounts {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .demo-accounts-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #475569;
      margin-bottom: 10px;
      text-align: center;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .demo-btn {
      padding: 8px 10px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      cursor: pointer;
      text-align: center;
      transition: background var(--transition), border-color var(--transition);
    }
    .demo-btn:hover {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.18);
    }
    .demo-role { font-size: 0.75rem; font-weight: 700; color: #93c5fd; display: block; }
    .demo-email { font-size: 0.7rem; color: #475569; display: block; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18V18h2v-5.82L9 13.4V18H7v2h10v-2h-2v-4.6l2-1.22V18h2v-6.82L23 9 12 3zm0 2.24L19.64 9 12 12.76 4.36 9 12 5.24z"/></svg>
      </div>
      <h1>School Inventory System</h1>
      <p>Manage your school assets efficiently</p>
    </div>

    <div class="login-card">
      <h2>Welcome back</h2>
      <p class="login-sub">Sign in to your account to continue</p>

      <div class="login-error" id="loginError" role="alert" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16.5"/></svg>
        <span id="loginErrorText">Invalid credentials.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group mb-16">
          <label class="form-label" for="loginEmail">Email address</label>
          <div class="input-group">
            <span class="input-group-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input
              type="email"
              id="loginEmail"
              class="form-control"
              placeholder="you@school.edu.ph"
              autocomplete="email"
              required
              aria-required="true"
            />
          </div>
          <span class="form-error" id="emailError">Please enter a valid email address.</span>
        </div>

        <div class="form-group mb-8">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-group">
            <span class="input-group-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input
              type="password"
              id="loginPassword"
              class="form-control has-right-icon"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              aria-required="true"
            />
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="form-error" id="passwordError">Password is required.</span>
        </div>

        <div class="d-flex align-center justify-between mb-20" style="margin-top:4px;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="rememberMe" style="width:15px;height:15px;accent-color:var(--primary);cursor:pointer;" />
            <span style="font-size:.875rem;color:#94a3b8;">Remember me</span>
          </label>
          <a href="#" onclick="showForgotPassword(event)" style="font-size:.875rem;color:#60a5fa;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span id="loginBtnText">Sign in</span>
          <span class="spinner spinner-sm" id="loginSpinner" style="display:none;border-top-color:white;"></span>
        </button>
      </form>

      <div class="demo-accounts">
        <div class="demo-accounts-title">Demo Accounts (click to fill)</div>
        <div class="demo-grid">
          <button class="demo-btn" onclick="fillDemo('admin@school.edu.ph','Admin@123')" type="button">
            <span class="demo-role">Admin</span>
            <span class="demo-email">admin@school.edu.ph</span>
          </button>
          <button class="demo-btn" onclick="fillDemo('officer@school.edu.ph','Officer@123')" type="button">
            <span class="demo-role">Inv. Officer</span>
            <span class="demo-email">officer@school.edu.ph</span>
          </button>
          <button class="demo-btn" onclick="fillDemo('teacher@school.edu.ph','Teacher@123')" type="button">
            <span class="demo-role">Teacher</span>
            <span class="demo-email">teacher@school.edu.ph</span>
          </button>
          <button class="demo-btn" onclick="fillDemo('viewer@school.edu.ph','Viewer@123')" type="button">
            <span class="demo-role">Viewer</span>
            <span class="demo-email">viewer@school.edu.ph</span>
          </button>
        </div>
      </div>
    </div>

    <div class="login-footer">
      <p>© 2026 School Inventory System. All rights reserved.</p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      sendPasswordResetEmail,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
    import { app } from './js/firebase-config.js';

    const auth = getAuth(app);
    const db = getFirestore(app);

    // Redirect if already logged in; log login events
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Write a login activity log entry (best-effort, don't block redirect)
        try {
          const userSnap = await getDoc(doc(db, 'users', user.uid));
          const userData  = userSnap.exists() ? userSnap.data() : {};
          await addDoc(collection(db, 'activityLogs'), {
            userId:    user.uid,
            userName:  userData.name  || user.email || 'Unknown',
            userEmail: user.email     || '',
            userRole:  userData.role  || 'viewer',
            action:    'User Login',
            description: `${userData.name || user.email} signed in`,
            itemId:    null,
            itemName:  null,
            timestamp: serverTimestamp(),
            page:      'index.html'
          });
        } catch(e) { /* login logging is best-effort */ }
        window.location.href = 'dashboard.html';
      }
    });

    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');
    const loginSpinner = document.getElementById('loginSpinner');
    const loginError = document.getElementById('loginError');
    const loginErrorText = document.getElementById('loginErrorText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const remember = document.getElementById('rememberMe').checked;

      // Basic validation
      let valid = true;
      document.getElementById('emailError').style.display = 'none';
      document.getElementById('passwordError').style.display = 'none';
      document.getElementById('loginEmail').parentElement.parentElement.classList.remove('has-error');
      document.getElementById('loginPassword').parentElement.parentElement.classList.remove('has-error');

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('emailError').style.display = 'block';
        document.getElementById('loginEmail').parentElement.parentElement.classList.add('has-error');
        valid = false;
      }
      if (!password) {
        document.getElementById('passwordError').style.display = 'block';
        document.getElementById('loginPassword').parentElement.parentElement.classList.add('has-error');
        valid = false;
      }
      if (!valid) return;

      setLoading(true);
      loginError.classList.remove('show');

      try {
        const persistence = remember ? browserLocalPersistence : browserSessionPersistence;
        await setPersistence(auth, persistence);
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged will redirect
      } catch (err) {
        setLoading(false);
        loginErrorText.textContent = getAuthError(err.code);
        loginError.classList.add('show');
      }
    });

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtnText.textContent = loading ? 'Signing in…' : 'Sign in';
      loginSpinner.style.display = loading ? 'inline-block' : 'none';
    }

    function getAuthError(code) {
      const map = {
        'auth/user-not-found': 'No account found with this email address.',
        'auth/wrong-password': 'Incorrect password. Please try again.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/user-disabled': 'This account has been disabled. Contact your administrator.',
        'auth/too-many-requests': 'Too many failed attempts. Please try again later.',
        'auth/network-request-failed': 'Network error. Please check your internet connection.',
        'auth/invalid-credential': 'Invalid credentials. Please check your email and password.'
      };
      return map[code] || 'Unable to sign in. Please try again.';
    }

    // Expose to global for inline handlers
    window.showForgotPassword = async function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      if (!email) {
        loginErrorText.textContent = 'Enter your email address above first, then click "Forgot password".';
        loginError.classList.add('show');
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        loginError.style.background = 'rgba(22,163,74,.15)';
        loginError.style.borderColor = 'rgba(22,163,74,.3)';
        loginError.style.color = '#86efac';
        loginErrorText.textContent = 'Password reset email sent. Check your inbox.';
        loginError.classList.add('show');
      } catch(err) {
        loginErrorText.textContent = getAuthError(err.code);
        loginError.classList.add('show');
      }
    };

    window.fillDemo = function(email, password) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = password;
    };
  </script>

  <script>
    // Password toggle (non-module)
    document.getElementById('pwToggle').addEventListener('click', function() {
      const input = document.getElementById('loginPassword');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    });
  </script>
</body>
</html>
